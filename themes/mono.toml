# Monochrome theme — greyscale only, white background throughout.
# Based on light-high-contrast.
foreground = "000000"
border_color = "808080"
selected_elements_colors = { background = "c0c0c0", foreground = "000000" }
canvas_colors = { background = "ffffff", alt_background = "ffffff", foreground = "000000" }
primary_ui_color = { background = "ffffff", foreground = "000000" }
secondary_ui_color = { background = "ffffff", foreground = "000000" }
accent_info = { background = "606060", foreground = "ffffff" }
accent_warn = { background = "909090", foreground = "000000" }
accent_error = { background = "404040", foreground = "ffffff" }
clock_highlight_line = { color = "909090", width = 2 }
